<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background tile -->
  <rect width="32" height="32" rx="6" fill="#0b0a09"/>

  <!-- Lowercase "a" — muted, small, top-left -->
  <text
    x="3"
    y="17"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="13"
    font-weight="700"
    font-style="italic"
    fill="#4a4438"
    letter-spacing="-0.5"
  >a</text>

  <!-- Uppercase "A" — orange, dominant, right -->
  <text
    x="13"
    y="26"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="20"
    font-weight="900"
    font-style="italic"
    fill="#f97316"
  >A</text>

  <!-- Small arrow dot hinting at transformation -->
  <circle cx="10.5" cy="20" r="1.2" fill="#4a4438"/>
</svg>
